# ============================================================================
# release-publish.yml — GitHub Releases distribution (Felipe directive 2026-05-08).
#
# Replaces cutover G9's cdn.automagik.dev publish workflow. GitHub Releases
# is free, maintained by GitHub, and `gh attestation verify` reads cosign
# signatures from Sigstore Rekor without any custom verification server.
#
# Trigger: runs after `sign-attest.yml` completes successfully (workflow_run)
# OR on manual dispatch. The workflow_run trigger ensures the signing
# artifacts exist BEFORE release-publish attempts to attach them — closes
# the race window that previously shipped releases with no signing siblings.
#
# Pipeline:
#   1. Download `autopg-signed-bundle-<version>` aggregate artifact from
#      sign-attest.yml's upstream workflow_run (contains tarballs + sha256 +
#      sig + cert + intoto.jsonl + manifest.json — everything in one fetch)
#   2. Sanity-check: every tarball must have its sig + cert + intoto.jsonl
#      + sha256 siblings before any release upload happens
#   3. Create GitHub Release (draft until manual promotion) with all assets
#   4. Update `latest.json` channel pointer in the repo (committed, served via
#      raw.githubusercontent.com — install.sh reads this for stable/beta/canary
#      resolution)
#
# Verification by consumers:
#   gh release download v<version> --repo namastexlabs/pgserve --pattern '*.tar.gz'
#   pgserve verify autopg-<v>-<platform>.tar.gz
#   # OR raw cosign keyless:
#   cosign verify-blob \
#     --certificate-identity-regexp '^https://github.com/namastexlabs/pgserve/.github/workflows/sign-attest.yml@refs/tags/v.*$' \
#     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
#     --signature autopg-<v>-<platform>.tar.gz.sig \
#     --certificate autopg-<v>-<platform>.tar.gz.cert \
#     autopg-<v>-<platform>.tar.gz
# ============================================================================

name: release-publish

on:
  workflow_run:
    workflows: ["Sign + Attest Tarballs (autopg)"]
    types: [completed]
    # No `branches:` filter — let workflow_run fire on every successful
    # sign-attest run, including tag refs (Wave A PR-A1 Mismatch 5 fix
    # mirror — same logic as sign-attest.yml's own trigger).
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 2.6.2)'
        required: true
      sign_run_id:
        description: |
          Workflow run ID of the upstream "Sign + Attest Tarballs (autopg)"
          run that produced the autopg-signed-bundle-<version> artifact.
          Find it via:
            gh run list --workflow "Sign + Attest Tarballs (autopg)" --limit 5
          REQUIRED for manual dispatch — there's no automatic upstream
          run-id resolution outside the workflow_run trigger path.
        required: true
      channel:
        description: 'Release channel'
        required: true
        type: choice
        default: stable
        options:
          - stable
          - beta
          - canary
      draft:
        description: 'Create as draft (require manual promotion)?'
        required: true
        type: boolean
        default: true

concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false   # never cancel an in-flight publish

permissions:
  contents: write              # gh release create
  id-token: write              # cosign keyless OIDC (if re-signing)
  attestations: write          # actions/attest-build-provenance@v1
  actions: read                # cross-run download via `run-id` requires
                               # this — when an explicit permissions block
                               # is present, unlisted scopes are denied,
                               # so we must enumerate every scope we use.

jobs:
  publish:
    name: Publish to GitHub Releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # On workflow_run trigger only fire if the upstream sign-attest run
    # succeeded. workflow_dispatch path has no upstream and falls through.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On workflow_run, the head_sha is the commit sign-attest ran
          # against; use it so latest.json updates happen on the right ref.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Resolve version
        id: ver
        env:
          # workflow_run carries the upstream's head_branch which is the
          # tag name (e.g. `v2.6.4`) for tag-triggered runs.
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${UPSTREAM_BRANCH}" ]; then
            # workflow_run: strip leading `v` if present
            echo "version=${UPSTREAM_BRANCH#v}" >> "$GITHUB_OUTPUT"
          else
            # Manual dispatch fallback: read package.json
            VER=$(node -p "require('./package.json').version")
            echo "version=${VER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve channel
        id: ch
        run: |
          if [ -n "${{ inputs.channel }}" ]; then
            echo "channel=${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
          else
            # Default tag pushes to stable; manual dispatches override above.
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Download signed bundle aggregate (sign-attest.yml)
        uses: actions/download-artifact@v4
        with:
          # sign-attest.yml's aggregate job uploads ONE artifact named
          # `autopg-signed-bundle-<version>` containing every per-platform
          # tarball + sha256 + sig + cert + intoto.jsonl + manifest.json.
          # Single download replaces the prior pair of broken patterns
          # (`autopg-*-tarball`, `autopg-*-signed`) that didn't match
          # any real artifact name.
          name: autopg-signed-bundle-${{ steps.ver.outputs.version }}
          path: dist/
          # Cross-workflow downloads need the upstream run-id +
          # github-token. workflow_run gives us the run-id for free
          # (github.event.workflow_run.id); manual dispatch operators
          # must supply it via the `sign_run_id` input.
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.sign_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List release assets
        run: |
          echo "=== dist/ ==="
          ls -la dist/ || true

      - name: Sanity-check signed bundle siblings (Wave A PR-A2 D8)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          MISSING=0
          shopt -s nullglob
          TARBALLS=(dist/autopg-${VERSION}-*.tar.gz)
          if [ ${#TARBALLS[@]} -eq 0 ]; then
            echo "::error::no autopg-${VERSION}-*.tar.gz tarballs in dist/ — sign-attest bundle is empty"
            exit 1
          fi
          for tb in "${TARBALLS[@]}"; do
            for ext in sig cert intoto.jsonl sha256; do
              if [ ! -f "${tb}.${ext}" ]; then
                echo "::error::missing ${tb}.${ext}"
                MISSING=$((MISSING + 1))
              fi
            done
          done
          if [ "${MISSING}" -gt 0 ]; then
            echo "::error::${MISSING} required sibling files missing — refusing to publish a release without signing material"
            exit 1
          fi
          echo "::notice::all ${#TARBALLS[@]} tarballs have complete sig + cert + intoto.jsonl + sha256 siblings"

      - name: Create GitHub Release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          CHANNEL: ${{ steps.ch.outputs.channel }}
          DRAFT_FLAG: ${{ inputs.draft && '--draft' || '' }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$CHANNEL" != "stable" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Create release if it doesn't exist; else upload assets to existing.
          if ! gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" \
              --repo "${{ github.repository }}" \
              --title "v${VERSION}" \
              --notes "Release v${VERSION} (channel: ${CHANNEL})" \
              ${DRAFT_FLAG} ${PRERELEASE_FLAG}
          fi

          # Upload all dist/* assets (--clobber overwrites if re-running)
          if [ -d dist ] && [ "$(ls -A dist 2>/dev/null)" ]; then
            gh release upload "v${VERSION}" \
              --repo "${{ github.repository }}" \
              --clobber \
              dist/*
          else
            echo "::warning::dist/ is empty — no assets to upload"
          fi

      # ---------------------------------------------------------------------
      # Per-channel manifest pointers — committed to main so install.sh +
      # `autopg update` can resolve the current version for each channel via:
      #   curl -fsSL https://raw.githubusercontent.com/<repo>/main/.well-known/<channel>.json
      #
      # Filename map (mirrors genie wish release-channel-dev, PR #2419, and
      # omni PR #633 — Phase A of the cross-repo unification):
      #   stable → latest.json     (kept for back-compat with v1 manifest layout)
      #   beta   → beta.json       (reserved for future operator dispatch)
      #   canary → canary.json     (reserved for future operator dispatch)
      #
      # NO `dev` channel for pgserve. autopg ships from main only — there
      # is no dev branch posture, no auto-version-from-dev workflow, and no
      # development-channel consumers. Felipe directive 2026-05-12: "no dev
      # branch, autopg wont have dev channel". The genie-style stable-also-
      # writes-dev.json behavior is intentionally omitted here.
      #
      # The stable-only gate that lived here previously was lifted — every
      # non-draft publish writes the manifest for its channel. In practice
      # today only `stable` channel runs through this workflow (beta/canary
      # are reserved for future operator dispatch); the case-statement
      # keeps the same code shape as omni/genie for cross-repo readability.
      # ---------------------------------------------------------------------
      - name: Update channel manifests (.well-known/*.json — non-draft only)
        if: ${{ !inputs.draft }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          CHANNEL: ${{ steps.ch.outputs.channel }}
        run: |
          set -euo pipefail
          # stable keeps the historical filename `latest.json`; every other
          # channel uses its own name. install.sh + autopg update consume
          # the same convention. Unlike genie/omni, no dev branch path
          # exists for pgserve so the stable-also-advances-dev case is
          # intentionally absent.
          declare -A MANIFEST_FILES=()
          case "$CHANNEL" in
            stable) MANIFEST_FILES[stable]="latest.json" ;;
            *)      MANIFEST_FILES[$CHANNEL]="${CHANNEL}.json" ;;
          esac

          mkdir -p .well-known
          for manifest_channel in "${!MANIFEST_FILES[@]}"; do
            FILE="${MANIFEST_FILES[$manifest_channel]}"
            cat > ".well-known/${FILE}" <<EOF
          {
            "schema_version": 1,
            "channel": "${manifest_channel}",
            "version": "${VERSION}",
            "released_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "tarball_base": "https://github.com/${{ github.repository }}/releases/download/v${VERSION}",
            "platforms": ["linux-x64-glibc","linux-x64-musl","linux-arm64","darwin-x64","darwin-arm64"]
          }
          EOF
          done

          git config user.name "release-bot"
          git config user.email "release-bot@namastex.com"
          # Stage first, then compare against HEAD. `git diff --quiet <path>`
          # returns 0 (no diff) for *untracked* files because they aren't in
          # the index — staging registers the path; then
          # `git diff --cached --quiet HEAD --` correctly reports "differs
          # from HEAD" for both new and modified files. Mirrors the
          # bootstrap fix from genie PR #2412/#2419.
          MANIFEST_PATHS=()
          for f in "${MANIFEST_FILES[@]}"; do
            MANIFEST_PATHS+=(".well-known/${f}")
          done
          git add "${MANIFEST_PATHS[@]}"
          if git diff --cached --quiet HEAD -- "${MANIFEST_PATHS[@]}"; then
            echo "manifests unchanged — nothing to commit"
            exit 0
          fi
          MANIFEST_LIST=$(IFS=','; echo "${!MANIFEST_FILES[*]}")
          git commit -m "chore(release): update manifests (${MANIFEST_LIST}) → v${VERSION}"
          git push origin HEAD:main || echo "::warning::push failed (likely permission); update ${MANIFEST_PATHS[*]} manually"
