name: Build Tarballs (autopg)

# Group 7 of autopg-distribution-cutover — produces per-platform tarballs
# bundling the autopg CLI + the matching postgres server binaries.
#
# This workflow runs on tag pushes and via manual dispatch. It uploads each
# tarball + outer .sha256 as a build artifact so Group 8 (cosign sign +
# SLSA attest) and Group 9 (CDN publish) can consume them in downstream
# workflows.
#
# Matrix: 5 platforms — linux-x64-glibc, linux-x64-musl, linux-arm64,
# darwin-x64, darwin-arm64. Each job runs the same three-stage pipeline:
#
#   1. scripts/build-binary.sh        → dist/<pf>/autopg/autopg
#   2. scripts/fetch-postgres-bins.sh → dist/<pf>/autopg/postgres/{bin,share}/
#   3. scripts/assemble-tarball.sh    → dist/autopg-<ver>-<pf>.tar.gz
#
# A separate `smoke` job runs the fixture-based smoke test against the
# scripts independent of real binaries — gates every PR.

on:
  push:
    tags:
      - 'v*'
      - 'autopg-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (default: package.json)'
        required: false
        type: string
      pg_pkg_version:
        description: '@embedded-postgres/<pf> version'
        required: false
        type: string
        default: '18.3.0-beta.17'
  pull_request:
    paths:
      - 'scripts/build-binary.sh'
      - 'scripts/fetch-postgres-bins.sh'
      - 'scripts/assemble-tarball.sh'
      - 'tests/integration/tarball-smoke.sh'
      - '.github/workflows/build-tarballs.yml'

concurrency:
  group: build-tarballs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Smoke (fixture-based) — runs on every PR + dispatch. Validates the
  # script pipeline shape without requiring bun or @embedded-postgres on
  # the runner.
  # ---------------------------------------------------------------------------
  smoke:
    name: Smoke (fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-x64-glibc
          - linux-x64-musl
          - linux-arm64
          - darwin-x64
          - darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Lint scripts
        run: |
          shellcheck -S warning \
            scripts/build-binary.sh \
            scripts/fetch-postgres-bins.sh \
            scripts/assemble-tarball.sh \
            scripts/aggregate-manifest.sh \
            scripts/verify-published-artifacts.sh \
            tests/integration/tarball-smoke.sh \
            tests/integration/sign-attest-smoke.sh

      - name: Run fixture smoke
        run: bash tests/integration/tarball-smoke.sh --fixture --platform ${{ matrix.platform }}

  # ---------------------------------------------------------------------------
  # Sign + Attest (fixture) — exercises Group 8's cosign + manifest +
  # verify scripts using the test-only fixture keypair. Gates every PR.
  # ---------------------------------------------------------------------------
  sign-attest-smoke:
    name: Sign + Attest (fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'
      - name: Run sign-attest fixture smoke
        run: bash tests/integration/sign-attest-smoke.sh

  # ---------------------------------------------------------------------------
  # Build (real) — runs on tag pushes + dispatch. Builds + bundles real
  # tarballs and uploads them as artifacts for downstream signing.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.platform }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-glibc
            runner:   ubuntu-latest
          - platform: linux-x64-musl
            runner:   ubuntu-latest
          - platform: linux-arm64
            # GitHub-hosted ARM64 runners; falls back to QEMU emulation
            # if the org has not yet enabled ubuntu-24.04-arm runners.
            runner:   ubuntu-24.04-arm
          - platform: darwin-x64
            runner:   macos-13
          - platform: darwin-arm64
            runner:   macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      # Stage 1 — compile autopg.
      # Fallback (pkg/nexe) is enabled per the wish G7 contract; bun is
      # the primary, the fallback is documented in build.log.
      - name: Build autopg binary
        shell: bash
        env:
          AUTOPG_BUILD_FALLBACK: '1'
        run: bash scripts/build-binary.sh --platform ${{ matrix.platform }} --version ${{ steps.ver.outputs.version }}

      # Stage 2 — fetch postgres bins.
      # @embedded-postgres covers linux-x64-glibc + darwin-{x64,arm64}.
      # linux-x64-musl + linux-arm64 require AUTOPG_POSTGRES_URL_TEMPLATE
      # (passed via repo secret in production) or AUTOPG_POSTGRES_LOCAL_DIR
      # in a self-hosted runner cache. Failure here is loud, not silent.
      - name: Fetch postgres bins
        shell: bash
        env:
          AUTOPG_POSTGRES_PKG_VERSION:  ${{ inputs.pg_pkg_version || '18.3.0-beta.17' }}
          AUTOPG_POSTGRES_URL_TEMPLATE: ${{ vars.AUTOPG_POSTGRES_URL_TEMPLATE }}
        run: bash scripts/fetch-postgres-bins.sh --platform ${{ matrix.platform }}

      # Stage 3 — assemble the tarball + emit outer .sha256.
      - name: Assemble tarball
        shell: bash
        run: bash scripts/assemble-tarball.sh --platform ${{ matrix.platform }} --version ${{ steps.ver.outputs.version }}

      # Stage 4 — gate via the real-mode smoke test.
      - name: Smoke real tarball
        shell: bash
        run: bash tests/integration/tarball-smoke.sh --real --platform ${{ matrix.platform }} --version ${{ steps.ver.outputs.version }}

      - name: Verify size band (50–80MB)
        shell: bash
        run: |
          TARBALL="dist/autopg-${{ steps.ver.outputs.version }}-${{ matrix.platform }}.tar.gz"
          SIZE_MB=$(du -m "$TARBALL" | cut -f1)
          echo "Tarball size: ${SIZE_MB}MB"
          if [[ "$SIZE_MB" -lt 30 || "$SIZE_MB" -gt 120 ]]; then
            echo "::error::tarball size out of expected band (got ${SIZE_MB}MB; expected 30-120MB sanity-band)"
            exit 1
          fi

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: autopg-${{ steps.ver.outputs.version }}-${{ matrix.platform }}
          path: |
            dist/autopg-${{ steps.ver.outputs.version }}-${{ matrix.platform }}.tar.gz
            dist/autopg-${{ steps.ver.outputs.version }}-${{ matrix.platform }}.tar.gz.sha256
            dist/build.log
            dist/build-record.tsv
          retention-days: 14
          if-no-files-found: error
