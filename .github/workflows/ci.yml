name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install

      - name: Run linter
        run: bun run lint

      - name: Run dead code check
        run: bun run deadcode

      # Build the console SPA before tests. tests/console/no-cdn.test.js
      # boots `autopg ui` and asserts the served bundle has zero CDN refs;
      # console/dist/ is gitignored so CI must produce it on every run.
      - name: Build console
        run: bun run console:build

      # `bun test` defaults to a 5s per-test timeout. Daemon-control tests
      # spin up a real PostgresManager (initdb + postgres + WAL warmup),
      # which on a cold CI runner with no cached embedded-postgres binaries
      # can occasionally exceed 5s for the first daemon test. Bump to 30s
      # to absorb the variance — passing tests keep their fast wall-clock.
      - name: Run tests
        run: bun test --timeout 30000

  # Optional: Run on multiple platforms
  test-matrix:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS is best-effort for v2.0 — Darwin reader implemented but unverified per
    # WISH.md ("Linux-only for v2.0, revisit in v2.1") and PR #37 body. Tests still
    # run + surface as warnings but don't block merge. Tracking in issue #39.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install

      - name: Build console
        run: bun run console:build

      - name: Run tests
        run: bun test --timeout 30000

  # Validate build works
  build-check:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install

      - name: Build executable
        run: |
          mkdir -p dist
          bun build --compile bin/postgres-server.js --outfile dist/pgserve

      - name: Verify executable
        run: |
          ./dist/pgserve --help
          echo "Build successful!"

  # Optional: integration smoke for `pgserve provision` + `pgserve gc`.
  # Wired as a non-blocking matrix until the GHA cache for postgres
  # binaries is warm. The script itself skips gracefully if initdb /
  # pg_ctl / psql are not on PATH, so this job is also a no-op on hosts
  # that don't have postgres installed.
  test-integration-gc-provision:
    name: Integration (gc + provision round-trip)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install

      - name: Install postgres client + server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql postgresql-client
          # Make sure initdb / pg_ctl / psql resolve on $PATH for the script.
          PG_BINDIR="$(pg_config --bindir 2>/dev/null || ls -d /usr/lib/postgresql/*/bin 2>/dev/null | tail -1)"
          echo "$PG_BINDIR" >> "$GITHUB_PATH"

      - name: Run gc/provision round-trip smoke
        run: bash tests/integration/gc-provision.test.sh

  # autopg-distribution-cutover-finalize G3 — `pgserve create-app` +
  # `pgserve verify --slug` lock-vs-live trust differential. Mirrors the
  # gc/provision job above (continue-on-error + apt postgres). Skips
  # gracefully if postgres binaries are missing.
  test-integration-verify-slug-rotation:
    name: Integration (verify --slug lock-vs-live rotation)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install

      - name: Install postgres client + server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql postgresql-client
          PG_BINDIR="$(pg_config --bindir 2>/dev/null || ls -d /usr/lib/postgresql/*/bin 2>/dev/null | tail -1)"
          echo "$PG_BINDIR" >> "$GITHUB_PATH"

      - name: Run create-app + verify --slug rotation smoke
        run: bash tests/integration/verify-slug-rotation.test.sh

  # Test npx flow (user experience)
  test-npx:
    name: Test npx install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (for packing)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Node.js (for testing)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps and pack
        run: |
          bun install
          bun pm pack --destination /tmp --ignore-scripts

      - name: Test npx install (fresh environment)
        run: |
          cd /tmp
          mkdir test-pgserve
          cd test-pgserve
          npm init -y
          npm install /tmp/pgserve-*.tgz
          timeout 30 npx pgserve --help
          echo "npx test passed!"
